<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Terrarium: your GitHub year as a voxel island</title>
<meta name="description" content="Grow a voxel island from your GitHub activity and save it as a wallpaper for your exact screen. Built with Bend, ray traced on your GPU.">
<style>
  :root { color-scheme: dark; --fg: #e8eef0; --dim: #8b979b; --line: #22292b; --accent: #ff7ac0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg);
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100dvh; }
  .stage { flex: 1; display: grid; place-items: center; min-height: 0; padding: 12px; }
  canvas { max-width: 100%; max-height: 72dvh; width: auto; height: auto; border-radius: 14px;
    background: #000; display: none; box-shadow: 0 0 0 1px var(--line); }
  body.grown canvas { display: block; }
  .hero { text-align: center; max-width: 30rem; padding: 0 8px; }
  body.grown .hero { display: none; }
  h1 { font-size: 1.9rem; margin: 0 0 .4rem; letter-spacing: -.02em; }
  .hero p { color: var(--dim); margin: 0; }
  .panel { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
    display: grid; gap: 10px; max-width: 40rem; width: 100%; margin: 0 auto; }
  form { display: flex; gap: 8px; }
  input, select, button { font: inherit; color: var(--fg); background: #0b0f10; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; min-height: 44px; }
  input { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  button.primary { background: var(--fg); color: #000; border-color: var(--fg); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: 1; }
  .seg button { border: 0; border-radius: 0; flex: 1; background: transparent; }
  .seg button.on { background: #1a2124; }
  .controls { display: none; }
  body.grown .controls { display: grid; gap: 10px; }
  #status { color: var(--dim); font-size: .85rem; min-height: 1.2em; }
  #facts { color: var(--dim); font-size: .85rem; }
  #facts b { color: var(--fg); font-weight: 600; }
  .dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; margin: 0 .25em 0 .1em; }
  body.busy button, body.busy select { pointer-events: none; opacity: .6; }
  footer { color: var(--dim); font-size: .8rem; text-align: center; padding-bottom: 6px; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
  <div class="stage">
    <div class="hero">
      <h1>Terrarium</h1>
      <p>Your GitHub year, grown into a tiny voxel island. Get it as a wallpaper made for your exact screen. The night one is true black for AMOLED.</p>
    </div>
    <canvas id="canvas"></canvas>
  </div>
  <div class="panel">
    <form id="form">
      <input id="login" placeholder="GitHub username" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <button class="primary">Grow</button>
    </form>
    <div class="controls">
      <div class="row">
        <div class="seg"><button data-mode="night" class="on">Night</button><button data-mode="day">Day</button></div>
        <select id="size"><option value="screen">This screen</option></select>
      </div>
      <div class="row">
        <button id="save" class="primary" disabled>Save wallpaper</button>
        <button id="share">Share link</button>
      </div>
      <div id="facts"></div>
    </div>
    <div id="status"></div>
    <footer>Grown by <a href="https://github.com/bendlang/bend">Bend</a> and ray traced on your own device, from public GitHub data · <a href="https://github.com/antomanc/terrarium">source</a></footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
